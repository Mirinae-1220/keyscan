name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 압축 후 릴리스에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="keyscan-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/keyscan.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            gh release upload "$GITHUB_REF_NAME" "$name.zip"
          else
            cp "target/${{ matrix.target }}/release/keyscan" "$name/"
            tar czf "$name.tar.gz" "$name"
            gh release upload "$GITHUB_REF_NAME" "$name.tar.gz"
          fi
